# Machine-readable mirror of ../diagrams/multi_agent_framework_v3_workspace.drawio
# Conflict policy: drawio wins. This file is not a source of truth.
# runtime_id values come from the local OpenCode environment only (desktop 2.0.19
# catalog + recorded OpenCode usage). No guessing.
# "Sol Fast" = OpenCode catalog alias of the base Sol model (fast mode).
# Reasoning levels: 极高 -> #xhigh, 高 -> #high.

schema_version: 1

agents:

  - id: global-orchestrator
    display_name: Global Orchestrator
    role: orchestrator

    model:
      display_name: GPT-6 Sol Fast
      reasoning: 极高
      runtime_id: openai/gpt-6-sol-fast#xhigh

    lifecycle:
      type: persistent
      managed_by: lifecycle-agent

    responsibilities:
      - understand-final-objective
      - cross-project-routing
      - maintain-global-task-state
      - invoke-planner
      - invoke-project-sessions
      - invoke-governance-agents
      - aggregate-results
      - control-workflow-loop

    permissions:
      mem0_read: true
      mem0_write: true

    restrictions:
      - avoid-large-scale-direct-code-reading
      - avoid-direct-business-code-implementation

  - id: project-reader
    display_name: Project Reader
    role: reader
    instance_scope: per-project

    model:
      display_name: DeepSeek-V4.1-Flash
      reasoning: null
      runtime_id: deepseek/deepseek-flash

    lifecycle:
      type: persistent
      managed_by: lifecycle-agent
      rotation_supported: true

    responsibilities:
      - read-source-code
      - search-files
      - inspect-git-diff
      - inspect-logs
      - inspect-project-state
      - database-read-only-query
      - produce-structured-context

    permissions:
      source_write: false
      database_read: true
      database_write: false
      mem0_read: true
      mem0_write: false

    restrictions:
      - no-business-code-write
      - no-ddl
      - no-dml-write

  - id: planner
    display_name: Planner
    role: planner

    model:
      display_name: GPT-6 Sol Fast
      reasoning: 极高
      runtime_id: openai/gpt-6-sol-fast#xhigh

    lifecycle:
      type: feature-scoped

    responsibilities:
      - complex-analysis
      - task-decomposition
      - build-task-dag
      - dependency-analysis
      - root-cause-analysis
      - project-routing
      - define-acceptance-criteria
      - rework-planning

  - id: lifecycle-agent
    display_name: Lifecycle Agent
    role: governance

    model:
      display_name: DeepSeek-V4.1-Flash
      reasoning: null
      runtime_id: deepseek/deepseek-flash

    lifecycle:
      type: persistent

    responsibilities:
      - manage-session-registry
      - monitor-context-thresholds
      - create-checkpoint
      - rotate-session
      - archive-session
      - restore-session
      - manage-project-main-lifecycle
      - manage-project-reader-lifecycle
      - manage-feature-executor-lifecycle
      - manage-planner-lifecycle

    permissions:
      business_code_write: false

  - id: feature-executor
    display_name: Feature Executor
    role: executor
    instance_scope: per-project-per-feature

    model:
      display_name: null
      reasoning: null
      runtime_id: null

    lifecycle:
      type: feature-scoped
      close_on: reviewer-pass

    responsibilities:
      - implement-feature
      - fix-review-findings
      - produce-git-diff
      - report-changed-files

  - id: db-operator
    display_name: DB Operator
    role: database-operator

    model:
      display_name: qwen3.8-max
      plan: Token Plan
      reasoning: null
      runtime_id: bailian-token-plan/qwen3.8-max

    lifecycle:
      type: feature-scoped
      close_on: reviewer-pass

    responsibilities:
      - database-insert
      - database-update
      - database-delete
      - ddl
      - index-management
      - database-backup

    permissions:
      database_read: true
      database_write: true
      database_ddl: true

    rules:
      database_project: ruoyi-vue-pro
      default_database_target: mysql-local
      server_database_target: mysql-server
      server_target_requires_explicit_request: true
      backup_before_high_risk_operation: true

  - id: api-runner
    display_name: API Runner
    role: api-runner

    model:
      display_name: DeepSeek-V4.1-Flash
      reasoning: null
      runtime_id: deepseek/deepseek-flash

    lifecycle:
      type: test-round-scoped

    responsibilities:
      - real-http-request
      - curl-request
      - openapi-validation
      - request-response-validation
      - api-regression
      - integration-debugging

    permissions:
      business_code_write: false

  - id: test-runner
    display_name: Test Runner
    role: test-runner

    model:
      display_name: DeepSeek-V4.1-Flash
      reasoning: null
      runtime_id: deepseek/deepseek-flash

    model_policy:
      replaceable_with_fast_stable_model: true

    lifecycle:
      type: test-round-scoped

    responsibilities:
      - compile
      - unit-test
      - build
      - regression-test
      - sql-explain
      - log-check

  - id: reviewer
    display_name: Reviewer
    role: reviewer

    model:
      display_name: GPT-5.6 Sol
      reasoning: 高
      runtime_id: openai/gpt-5.6-sol#high

    lifecycle:
      type: per-review-round
      always_new_session: true

    responsibilities:
      - independent-review
      - acceptance-validation
      - detect-missing-work
      - detect-side-effects
      - consistency-check

    outputs:
      - PASS
      - FIX
      - REWORK

    restrictions:
      - executor-must-not-self-review

  - id: documentation-agent
    display_name: Documentation Agent
    role: documentation

    model:
      display_name: DeepSeek-V4.1-Flash
      reasoning: null
      runtime_id: deepseek/deepseek-flash

    lifecycle:
      type: event-driven

    triggers:
      - reviewer-pass
      - api-contract-change
      - database-schema-change
      - architecture-change

    responsibilities:
      - maintain-framework-docs
      - maintain-api-docs
      - maintain-db-docs
      - maintain-changelog
      - maintain-checkpoint-docs

  - id: memory-agent
    display_name: Memory Agent
    role: memory-governance

    model:
      display_name: GPT-5.6 Sol Fast
      reasoning: 高
      runtime_id: openai/gpt-5.6-sol-fast#high

    lifecycle:
      type: event-driven

    triggers:
      - reviewer-pass

    responsibilities:
      - write-validated-long-term-knowledge
      - prevent-runtime-state-from-entering-mem0

    permissions:
      mem0_read: true
      mem0_write: true

    restrictions:
      - no-temporary-task-state-in-mem0

project_sessions:

  ruoyi-vue-pro:
    model:
      display_name: GPT-5.6 Sol Fast
      reasoning: 高
      runtime_id: openai/gpt-5.6-sol-fast#high

  yudao-ui-admin-vue3:
    model:
      display_name: GPT-5.6 Sol Fast
      reasoning: 高
      runtime_id: openai/gpt-5.6-sol-fast#high

  xxl-job:
    model:
      display_name: null
      reasoning: null
      runtime_id: null
    assignment_status: unassigned

  nyamtn:
    model:
      display_name: GPT-5.6 Sol Fast
      reasoning: 高
      runtime_id: openai/gpt-5.6-sol-fast#high
