agents:
  -
    display_name: 'Global Orchestrator'
    id: global-orchestrator
    lifecycle:
      managed_by: lifecycle-agent
      type: persistent
    model:
      display_name: 'GPT-6 Sol Fast'
      reasoning: '极高'
      runtime_id: 'openai/gpt-6-sol-fast#xhigh'
    permissions:
      mem0_read: true
      mem0_write: true
    responsibilities:
      - understand-final-objective
      - cross-project-routing
      - maintain-global-task-state
      - invoke-planner
      - invoke-project-sessions
      - invoke-governance-agents
      - aggregate-results
      - control-workflow-loop
    restrictions:
      - avoid-large-scale-direct-code-reading
      - avoid-direct-business-code-implementation
    role: orchestrator
  -
    display_name: 'Project Main'
    id: project-main
    instance_scope: per-project
    lifecycle:
      managed_by: lifecycle-agent
      rotation_supported: true
      type: persistent
    model:
      display_name: null
      reasoning: null
      runtime_id: null
      source: project_sessions
    permissions:
      business_code_write: false
    responsibilities:
      - maintain-project-context
      - receive-project-tasks
      - coordinate-project-reader
      - coordinate-feature-executor
      - coordinate-db-operator
      - coordinate-api-runner
      - aggregate-project-results
      - return-project-summary
    restrictions:
      - do-not-directly-implement-feature
      - use-feature-executor-for-code-change
    role: project-coordinator
  -
    display_name: 'Project Reader'
    id: project-reader
    instance_scope: per-project
    lifecycle:
      managed_by: lifecycle-agent
      rotation_supported: true
      type: persistent
    model:
      display_name: DeepSeek-V4.1-Flash
      reasoning: null
      runtime_id: deepseek/deepseek-flash
    permissions:
      database_read: true
      database_write: false
      mem0_read: true
      mem0_write: false
      source_write: false
    responsibilities:
      - read-source-code
      - search-files
      - inspect-git-diff
      - inspect-logs
      - inspect-project-state
      - database-read-only-query
      - produce-structured-context
    restrictions:
      - no-business-code-write
      - no-ddl
      - no-dml-write
    role: reader
  -
    display_name: Planner
    id: planner
    lifecycle:
      type: feature-scoped
    model:
      display_name: 'GPT-6 Sol Fast'
      reasoning: '极高'
      runtime_id: 'openai/gpt-6-sol-fast#xhigh'
    responsibilities:
      - complex-analysis
      - task-decomposition
      - build-task-dag
      - dependency-analysis
      - root-cause-analysis
      - project-routing
      - define-acceptance-criteria
      - rework-planning
    role: planner
  -
    display_name: 'Lifecycle Agent'
    id: lifecycle-agent
    lifecycle:
      type: persistent
    model:
      display_name: DeepSeek-V4.1-Flash
      reasoning: null
      runtime_id: deepseek/deepseek-flash
    permissions:
      business_code_write: false
    responsibilities:
      - manage-session-registry
      - monitor-context-thresholds
      - create-checkpoint
      - rotate-session
      - archive-session
      - restore-session
      - manage-project-main-lifecycle
      - manage-project-reader-lifecycle
      - manage-feature-executor-lifecycle
      - manage-planner-lifecycle
    role: governance
  -
    display_name: 'Feature Executor'
    id: feature-executor
    instance_scope: per-project-per-feature
    lifecycle:
      close_on: reviewer-pass
      type: feature-scoped
    model:
      display_name: null
      reasoning: null
      runtime_id: null
      source: project_sessions
    responsibilities:
      - implement-feature
      - fix-review-findings
      - produce-git-diff
      - report-changed-files
    role: executor
  -
    display_name: 'DB Operator'
    id: db-operator
    lifecycle:
      close_on: reviewer-pass
      type: feature-scoped
    model:
      display_name: qwen3.8-max
      plan: 'Token Plan'
      reasoning: null
      runtime_id: bailian-token-plan/qwen3.8-max
    permissions:
      database_ddl: true
      database_read: true
      database_write: true
    responsibilities:
      - database-insert
      - database-update
      - database-delete
      - ddl
      - index-management
      - database-backup
    role: database-operator
    rules:
      backup_before_high_risk_operation: true
      database_project: ruoyi-vue-pro
      default_database_target: mysql-local
      server_database_target: mysql-server
      server_target_requires_explicit_request: true
  -
    display_name: 'API Runner'
    id: api-runner
    lifecycle:
      type: test-round-scoped
    model:
      display_name: DeepSeek-V4.1-Flash
      reasoning: null
      runtime_id: deepseek/deepseek-flash
    permissions:
      business_code_write: false
    responsibilities:
      - real-http-request
      - curl-request
      - openapi-validation
      - request-response-validation
      - api-regression
      - integration-debugging
    role: api-runner
  -
    display_name: 'Test Runner'
    id: test-runner
    lifecycle:
      type: test-round-scoped
    model:
      display_name: DeepSeek-V4.1-Flash
      reasoning: null
      runtime_id: deepseek/deepseek-flash
    model_policy:
      replaceable_with_fast_stable_model: true
    responsibilities:
      - compile
      - unit-test
      - build
      - regression-test
      - sql-explain
      - log-check
    role: test-runner
  -
    display_name: Reviewer
    id: reviewer
    lifecycle:
      always_new_session: true
      type: per-review-round
    model:
      display_name: 'GPT-5.6 Sol'
      reasoning: '高'
      runtime_id: 'openai/gpt-5.6-sol#high'
    outputs:
      - PASS
      - FIX
      - REWORK
    responsibilities:
      - independent-review
      - acceptance-validation
      - detect-missing-work
      - detect-side-effects
      - consistency-check
    restrictions:
      - executor-must-not-self-review
    role: reviewer
  -
    display_name: 'Documentation Agent'
    id: documentation-agent
    lifecycle:
      type: event-driven
    model:
      display_name: DeepSeek-V4.1-Flash
      reasoning: null
      runtime_id: deepseek/deepseek-flash
    responsibilities:
      - maintain-framework-docs
      - maintain-api-docs
      - maintain-db-docs
      - maintain-changelog
      - maintain-checkpoint-docs
    role: documentation
    triggers:
      - reviewer-pass
      - api-contract-change
      - database-schema-change
      - architecture-change
  -
    display_name: 'Memory Agent'
    id: memory-agent
    lifecycle:
      type: event-driven
    model:
      display_name: 'GPT-5.6 Sol Fast'
      reasoning: '高'
      runtime_id: 'openai/gpt-5.6-sol-fast#high'
    permissions:
      mem0_read: true
      mem0_write: true
    responsibilities:
      - write-validated-long-term-knowledge
      - prevent-runtime-state-from-entering-mem0
    restrictions:
      - no-temporary-task-state-in-mem0
    role: memory-governance
    triggers:
      - reviewer-pass
project_sessions:
  nyamtn:
    model:
      display_name: 'GPT-5.6 Sol Fast'
      reasoning: '高'
      runtime_id: 'openai/gpt-5.6-sol-fast#high'
  ruoyi-vue-pro:
    model:
      display_name: 'GPT-5.6 Sol Fast'
      reasoning: '高'
      runtime_id: 'openai/gpt-5.6-sol-fast#high'
  xxl-job:
    assignment_status: unassigned
    model:
      display_name: null
      reasoning: null
      runtime_id: null
  yudao-ui-admin-vue3:
    model:
      display_name: 'GPT-5.6 Sol Fast'
      reasoning: '高'
      runtime_id: 'openai/gpt-5.6-sol-fast#high'
schema_version: 1
