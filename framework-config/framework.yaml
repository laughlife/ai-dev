# Machine-readable mirror of ../diagrams/multi_agent_framework_v3_workspace.drawio
# Conflict policy: drawio wins. This file is not a source of truth.

schema_version: 1

framework:
  id: ai-dev
  name: AI Dev Multi-Agent Framework
  workspace_root: 'D:\ai-dev'

architecture:
  source_of_truth: ../diagrams/multi_agent_framework_v3_workspace.drawio
  source_type: drawio
  config_role: derived-mirror
  conflict_policy: drawio-wins

repositories:
  framework:
    path: 'D:\ai-dev'
    branch: master
    remote: https://github.com/laughlife/ai-dev.git

runtime_adapters:
  opencode:
    directory: ../.opencode/agents
    role: executable-agent-profiles
    source: agents.yaml

runtime_registry:
  implementation: opencode-plugin
  plugin: ../.opencode/plugins/runtime-registry
  database: ../runtime/tasks.db
  session_location: 'D:\ai-dev'
  managed_roles:
    - project-main
    - project-reader
  automatic_rotation: false

lifecycle_engine:
  implementation: opencode-plugin
  plugin: ../.opencode/plugins/lifecycle-engine
  database: ../runtime/tasks.db
  checkpoint_directory: ../runtime/checkpoints
  automatic_rotation: false
  primary_ui_handoff: manual-unless-runtime-proven

task_bus:
  implementation: opencode-plugin
  plugin: ../.opencode/plugins/task-bus
  database: ../runtime/tasks.db
  protocol: ../framework-config/task-bus.yaml
  automatic_dag_scheduler: false
  parallel_batch_dispatch: false

workflow_engine:
  implementation: opencode-plugin
  plugin: ../.opencode/plugins/workflow-engine
  database: ../runtime/tasks.db
  protocol: ../framework-config/workflow.yaml
  automatic_scheduler: true
  automatic_reviewer_loop: true
  automatic_lifecycle_rotation: false

runtime:
  directory: ../runtime
  persistent_in_git: false

backups:
  directory: ../.backups
  persistent_in_git: false

knowledge:
  architecture: drawio
  governance: AGENTS.md
  long_term_memory: mem0
  runtime_state: runtime
