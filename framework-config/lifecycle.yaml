context_rotation:
  checkpoint_from_percent: 60
  checkpoint_prepare:
    from_percent: 60
    to_percent: 70
  checkpoint_to_percent: 70
  continue_reuse_below_percent: 60
  hard_stop_new_tasks_at_percent: 80
  rotate_after_atomic_step_at_percent: 70
roles:
  api-runner:
    lifecycle: test-round-scoped
  db-operator:
    lifecycle: feature-scoped
  documentation-agent:
    lifecycle: event-driven
  feature-executor:
    close_on: reviewer-pass
    lifecycle: feature-scoped
  global-orchestrator:
    lifecycle: persistent
    rotation: managed
  lifecycle-agent:
    lifecycle: persistent
  memory-agent:
    lifecycle: event-driven
  planner:
    lifecycle: feature-scoped
  project-main:
    lifecycle: persistent
    rotation: managed
  project-reader:
    lifecycle: persistent
    prefer_reuse: true
    rotation: managed
  reviewer:
    always_new_session: true
    lifecycle: per-review-round
  test-runner:
    lifecycle: test-round-scoped
rotation_restore_context:
  - active-task
  - checkpoint
  - project-docs
  - git-state
  - required-mem0-context
runtime:
  implementation:
    checkpoint_directory: ../runtime/checkpoints
    database: ../runtime/tasks.db
    plugin: ../.opencode/plugins/lifecycle-engine
    type: opencode-plugin
  managed_roles:
    automatic_rotation:
      - project-main
      - project-reader
      - planner
      - feature-executor
    fresh_session_by_design:
      - reviewer
      - api-runner
      - test-runner
  primary_session:
    mode: checkpoint-and-successor-handoff
    role: global-orchestrator
    transparent_ui_switch: false
  telemetry:
    approximation_allowed: false
    context_limit_source: opencode-model-catalog
    context_usage_source: last-assistant-message-token-usage
    verified: true
schema_version: 1
