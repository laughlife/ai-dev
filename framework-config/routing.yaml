communication:
  cross_project_changes_via_task_bus: true
  mem0:
    read: all-agents
    role: long-term-knowledge
    runtime_message_bus: false
    write:
      - global-orchestrator
      - memory-agent
  runtime_agent_messages:
    mechanism: opencode-native-task-subagent
    payload: structured-json-task-envelope
database:
  default_target: mysql-local
  high_risk_operations_via_task_bus: true
  server_target: mysql-server
  server_target_requires_explicit_request: true
routes:
  api_code_change:
    target: feature-executor
  api_regression:
    target: api-runner
  api_runtime_call:
    target: api-runner
  build_and_test:
    target: test-runner
  code_change:
    target: feature-executor
  code_read:
    target: project-reader
  database_backup:
    target: db-operator
  database_ddl:
    target: db-operator
  database_read:
    target: project-reader
    tool: mysql-mcp
  database_write:
    target: db-operator
  documentation_update:
    target: documentation-agent
  independent_review:
    target: reviewer
  long_term_memory_write:
    requires:
      - reviewer-pass
    target: memory-agent
  project_analysis:
    target: planner
  project_coordination:
    target: project-main
  session_lifecycle:
    target: lifecycle-agent
schema_version: 1
