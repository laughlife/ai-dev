dispatch:
  mode: explicit
ephemeral_roles:
  - planner
  - feature-executor
  - db-operator
  - api-runner
  - test-runner
  - reviewer
  - documentation-agent
  - memory-agent
  - lifecycle-agent
features:
  automatic_dag_scheduler: false
  automatic_fix_rework_loop: false
  automatic_retry: false
  automatic_reviewer_loop: false
  dependency_guard: true
  parallel_batch_dispatch: false
implementation:
  database: ../runtime/tasks.db
  plugin: ../.opencode/plugins/task-bus
  type: opencode-plugin
persistent_roles:
  - project-main
  - project-reader
protocol:
  result_envelope: ../templates/result-envelope.schema.json
  task_envelope: ../templates/task-envelope.schema.json
schema_version: 1
state_machine:
  initial: READY
  states:
    - READY
    - BLOCKED
    - RUNNING
    - COMPLETED
    - FAILED
    - CANCELLED
