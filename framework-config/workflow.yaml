implementation:
  database: ../runtime/tasks.db
  plugin: ../.opencode/plugins/workflow-engine
  type: opencode-plugin
parallel_policy:
  global_serial_routes:
    - database_write
    - database_ddl
    - database_backup
    - long_term_memory_write
  project_serial_routes:
    - code_change
    - api_code_change
    - build_and_test
    - documentation_update
  safe_routes:
    - code_read
    - project_analysis
    - project_coordination
    - api_runtime_call
    - api_regression
planner:
  json_repair_attempts: 1
  route: project_analysis
protocol:
  reviewer_result: ../templates/reviewer-result.schema.json
  workflow_plan: ../templates/workflow-plan.schema.json
retry:
  enabled: true
  max_retries: 1
  never_retry_routes:
    - code_change
    - api_code_change
    - database_write
    - database_ddl
    - database_backup
    - documentation_update
    - long_term_memory_write
  safe_routes:
    - code_read
    - project_analysis
    - api_runtime_call
    - api_regression
    - build_and_test
    - independent_review
review:
  automatic: true
  max_rework_cycles: 2
scheduler:
  automatic: true
  lanes:
    api_integration:
      default_parallel: 3
      max_parallel: 6
    coding:
      default_parallel: 3
      max_parallel: 6
    controller:
      default_parallel: 1
      max_parallel: 1
    documentation:
      default_parallel: 3
      max_parallel: 6
    read_probe:
      default_parallel: 3
      max_parallel: 6
    reviewer:
      default_parallel: 1
      max_parallel: 3
    test_validation:
      default_parallel: 3
      max_parallel: 6
  legacy_max_parallel: 3
  max_parallel: 3
team_execution:
  complex:
    min_nodes: 3
  must_parallelize:
    min_ready_non_conflicting: 2
  ownership:
    write_scope_required_for_parallel_write: true
    fallback: project-exclusive
  scaling:
    strategy: per-lane-ready-backlog
    auto_scale: true
  controller:
    max_parallel: 1
schema_version: 1
